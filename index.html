<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vite App</title>
  </head>
  <body>

    <div class="cursors">

    </div>

    <div class="dice-wrapper">
      <div class="shield"> <span>Кубики</span> <strong class="double"></strong></div>
      
      <div class="content">
        <div class="six">
          <div class="dice">
            <p class="dicesix" data-write="true">6</p>
          </div>
        </div>

        <div class="eight">
          <img src="/dice/dice1.jpg" alt="">
          <p class="diceeight" data-write="true">8</p>
        </div>
      </div>

      <button class="roll">Бросить</button>
      <button class="rollLeft">Левый</button>
      <button class="rollRight">Правый</button>
    </div>

    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
